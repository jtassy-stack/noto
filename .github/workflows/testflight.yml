name: CI / TestFlight

on:
  push:
    branches: [master]
    # Docs/markdown never change the binary (asc-kit rule 7).
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: Noto

jobs:
  # ──────────────────────────────────────────────
  # Job 0 — Secrets scan (gitleaks)
  # Scans the working tree and the commits of this push/PR only. Repo
  # history is NOT rewritten (prod app), so a full-history scan would flag
  # the pre-rotation keys forever; the range scan only sees added lines.
  # ──────────────────────────────────────────────
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose
      - name: Scan commits in range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # Manual run on an already-scanned ref: nothing new to cover beyond
            # the tip (the working-tree scan above covers HEAD's content).
            gitleaks git . --config .gitleaks.toml --redact --verbose --log-opts="-1"
          elif [ -n "$BASE" ] && git cat-file -e "$BASE" 2>/dev/null; then
            gitleaks git . --config .gitleaks.toml --redact --verbose --log-opts="$BASE..HEAD"
          else
            # Push with no reachable base (new branch, force-push): scan the
            # whole history. Pre-rotation keys are ignored by exact fingerprint
            # in .gitleaksignore, so any other secret anywhere still fails.
            gitleaks git . --config .gitleaks.toml --redact --verbose
          fi

  # ──────────────────────────────────────────────
  # Job 1 — Build (every PR + master push)
  # Compiles for simulator, no signing required.
  # ──────────────────────────────────────────────
  build:
    name: Build (simulator)
    runs-on: macos-15
    timeout-minutes: 25
    needs: secrets
    permissions:
      contents: read
      id-token: write   # Infisical OIDC

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-xcodegen-${{ runner.os }}

      - name: Install XcodeGen
        run: brew install xcodegen

      # Build-time keys come from Infisical (project "noto", env prod) via a
      # GitHub OIDC machine identity: no GitHub secret to manage, rotation
      # happens in Infisical only. The identity id is a repo *variable*.
      - name: Fetch API keys from Infisical
        if: vars.INFISICAL_IDENTITY_ID != ''
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://eu.infisical.com   # must match the identity's bound audience
          domain: https://eu.infisical.com
          env-slug: prod
          project-slug: noto-ios
          export-type: env
          secret-path: /

      - name: Write Config.xcconfig
        run: |
          ci_scripts/write-xcconfig.sh --from-env
          # Simulator build only: empty keys compile fine (clients log and
          # fall back), so fork PRs — which get no OIDC identity — still build.
          if [ -z "$DIRECTORY_API_KEY" ] || [ -z "$CULTURE_API_KEY" ]; then
            echo "::warning::API keys empty — Infisical identity not configured (vars.INFISICAL_IDENTITY_ID)"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Noto.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Noto.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcpretty || true

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Noto.xcodeproj \
            -scheme NotoTests \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -clonedSourcePackagesDirPath SourcePackages \
            -enableCodeCoverage YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee test-output.log | xcpretty

      # xcpretty drops Swift Testing failures: print them from the raw log.
      - name: Show failing tests
        if: failure()
        run: |
          grep -v "CoreData" test-output.log \
            | grep -E "✘|recorded an issue|Test Case .* failed|failed after|crashed|Restarting after|unexpected exit|Fatal error" \
            | head -100 || true
          echo "--- before each crash ---"
          grep -v "CoreData" test-output.log | grep -B 25 "Restarting after" | grep -vE "passed after|^--$" | head -80 || true
          echo "--- end of raw log ---"
          grep -v "CoreData" test-output.log | tail -60 || true

      - name: Fix build with Claude
        if: failure()
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Read,Write,Edit,Glob,Grep"
          prompt: |
            The iOS build just failed on branch ${{ github.ref_name }}.

            Run `gh run view --log-failed ${{ github.run_id }}` to get the compiler errors,
            identify the root cause, fix the code, and commit + push directly to ${{ github.ref_name }}.

            Working directory is the repo root. Be concise and act directly.

  # ──────────────────────────────────────────────
  # Job 2 — Archive + TestFlight (master only)
  # Requires build to pass first.
  # ──────────────────────────────────────────────
  deploy:
    name: Archive & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 40
    needs: build
    permissions:
      contents: read
      id-token: write   # Infisical OIDC
    # Opt-in gate (asc-kit rule 4): a plain push to master no longer uploads —
    # only a commit whose TITLE starts with [testflight]/[tf], or a manual
    # workflow_dispatch. startsWith, not contains: a commit that merely
    # MENTIONS the marker in its body can't trigger an upload. Keeps a
    # multi-merge day from burning Apple's daily upload quota.
    # The [tf] commit must change a file outside paths-ignore: an empty
    # commit (or a docs-only one) never starts this workflow at all.
    if: >-
      github.ref == 'refs/heads/master' &&
      github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' ||
       startsWith(github.event.head_commit.message, '[testflight]') ||
       startsWith(github.event.head_commit.message, '[tf]'))

    env:
      ARCHIVE_PATH: build/Noto.xcarchive
      EXPORT_PATH: build/export

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the build number is the commit count (asc-kit rule 1).
          fetch-depth: 0

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version

      - name: Cache Homebrew
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: homebrew-xcodegen-${{ runner.os }}

      # Monotonic build number from the repo alone (asc-kit rule 1). Updates
      # every CURRENT_PROJECT_VERSION in project.yml (app + extensions must
      # share the build number). At migration: commit count 207 > last
      # TestFlight build 35, so the sequence stays increasing with no offset.
      - name: Set monotonic build number from commit count
        id: buildnum
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "Build number: $BUILD_NUMBER"
          sed -i '' "s/CURRENT_PROJECT_VERSION: [0-9]*/CURRENT_PROJECT_VERSION: $BUILD_NUMBER/" project.yml
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      # Build-time keys come from Infisical (project "noto", env prod) via a
      # GitHub OIDC machine identity: no GitHub secret to manage, rotation
      # happens in Infisical only. The identity id is a repo *variable*.
      - name: Fetch API keys from Infisical
        if: vars.INFISICAL_IDENTITY_ID != ''
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          oidc-audience: https://eu.infisical.com   # must match the identity's bound audience
          domain: https://eu.infisical.com
          env-slug: prod
          project-slug: noto-ios
          export-type: env
          secret-path: /

      - name: Write Config.xcconfig
        run: |
          ci_scripts/write-xcconfig.sh --from-env
          if [ -z "$DIRECTORY_API_KEY" ] || [ -z "$CULTURE_API_KEY" ]; then
            echo "::error::API keys missing — Infisical identity not configured (vars.INFISICAL_IDENTITY_ID)"; exit 1
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install certificate and provisioning profile
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PP_NOTO: ${{ secrets.PROVISIONING_PROFILE_NOTO }}
          PP_NOTO_DEVICEACTIVITY: ${{ secrets.PROVISIONING_PROFILE_NOTO_DEVICEACTIVITY }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          printf '%s' "$PP_NOTO" | base64 --decode > "$PP_DIR/noto.mobileprovision"
          printf '%s' "$PP_NOTO_DEVICEACTIVITY" | base64 --decode > "$PP_DIR/noto-deviceactivity.mobileprovision"

      # macos-15 runners ship a pre-warmed SPM binary-artifacts cache; when a
      # cached file is corrupted/zero-byte, resolution fails with "already
      # exists in file system" instead of re-downloading (asc-kit rule 8,
      # treve PR #158).
      - name: Clean stale SPM binary-artifacts cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Noto.xcodeproj \
            -scheme "$SCHEME" \
            -clonedSourcePackagesDirPath SourcePackages

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          printf '%s' "$ASC_KEY_BASE64" | base64 --decode \
            > ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8

      # No -allowProvisioningUpdates: signing is fully manual (cert + profiles
      # installed above, PROVISIONING_PROFILE_SPECIFIER set in project.yml), so
      # CI must never be able to mint throwaway certificates — that's what hit
      # the Apple account cert cap on keskonfe (asc-kit rule 2).
      - name: Archive
        run: |
          xcodebuild archive \
            -project Noto.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination generic/platform=iOS \
            -sdk iphoneos \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=ZU448G6529

      # ExportOptions sets destination=upload: the export IS the upload, no
      # local IPA is written (asc-kit rule 3). The ASC API key satisfies
      # Xcode's account-auth requirement without minting anything.
      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ci_scripts/ExportOptions.plist \
            -exportPath "$EXPORT_PATH" \
            -authenticationKeyPath ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # Post-upload distribution policy lives in .claude/asc/config.json
      # (groups, beta review, expire-old-builds) — one script for every repo.
      - name: Distribute build (groups / review / expiry)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_VERSION: ${{ steps.buildnum.outputs.build }}
        run: |
          # Node does not expand ~ — resolve the .p8 path here.
          export ASC_KEY_PATH="$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          node ci_scripts/testflight-release.mjs

      - name: Cleanup signing material
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -rf ~/.private_keys
